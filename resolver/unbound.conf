server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53

    # Allow queries only from the lab network
    access-control: 10.10.0.0/24 allow
    access-control: 127.0.0.0/8 allow

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Log every query – useful for the detectability slide
    log-queries: yes

    hide-identity: yes
    hide-version: yes

    # Needed inside Docker
    do-daemonize: no

# ── Realistic lab delegation ──────────────────────────────────
# In a real attack the attacker registers attacker.com and adds:
#   attacker.com.  NS  ns1.attacker.com.
#   ns1.attacker.com.  A  <VPS_IP>
# The resolver then reaches the attacker's server naturally.
# Here we replicate the same chain with a local stub-zone.
stub-zone:
    name: "tunnel.lab"
    stub-addr: 10.10.0.10

# ── Forward all other queries to the public internet ─────────
forward-zone:
    name: "."
    forward-addr: 8.8.8.8
    forward-addr: 8.8.4.4
